services:
  - type: web
    name: simplenutri-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/scripts/seed_db.py
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
