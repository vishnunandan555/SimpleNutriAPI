name: SimpleNutri Automated CI Pipeline

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Automated Tests & Data Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 1. Validate Authentic ICMR Dataset Integrity
        run: |
          python backend/scripts/validate_data.py

      - name: 2. Verify Standalone SQLite Mobile Export
        run: |
          python backend/scripts/export_offline_db.py

      - name: 3. Run Automated Pytest Suite (38 Tests)
        run: |
          pytest backend/tests/ -v --color=yes
